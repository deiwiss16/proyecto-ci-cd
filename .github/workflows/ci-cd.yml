name: Pipeline CI/CD del Proyecto

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v3

    - name: Configurar entorno de Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Instalar dependencias locales
      run: npm install

    - name: Ejecutar pruebas unitarias (Jest)
      run: npx jest

    - name: Construir imagen de Docker
      run: docker build -t proyecto-ci-cd .
